version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: maplayer-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: always

  postgres:
    image: postgres:15
    container_name: maplayer-postgres
    environment:
      POSTGRES_USER: maplayer
      POSTGRES_PASSWORD: maplayer_password
      POSTGRES_DB: maplayer_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:

networks:
  default:
    name: maplayer-network
